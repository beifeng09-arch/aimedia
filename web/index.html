<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AI 短剧脚本生成网站</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <div class="brand">
          <span class="brand-mark" aria-hidden="true"></span>
          <div>
            <p class="eyebrow">Script Generator</p>
            <h1>AI 短剧脚本生成网站</h1>
          </div>
        </div>
        <div class="status-strip" aria-label="生成状态">
          <span><strong id="sceneCount">0</strong> 场景</span>
          <span><strong id="wordCount">0</strong> 字数</span>
          <span><strong id="lengthCount">0</strong> 秒</span>
        </div>
      </header>

      <main class="workspace">
        <section class="panel script-panel" aria-label="脚本输入">
          <div class="panel-header">
            <div>
              <p class="eyebrow">Input</p>
              <h2>生成条件</h2>
            </div>
            <button class="ghost-button" id="loadSample" type="button">载入样例</button>
          </div>

          <label class="field-label" for="storyInput">核心创意（必填）</label>
          <textarea id="storyInput" spellcheck="false"></textarea>

          <div class="control-grid">
            <label>
              <span>题材</span>
              <select id="genreSelect">
                <option>都市悬疑</option>
                <option>现实情感</option>
                <option>古风权谋</option>
                <option>科幻冒险</option>
              </select>
            </label>
            <label>
              <span>目标时长</span>
              <select id="durationSelect">
                <option>60 秒</option>
                <option>90 秒</option>
                <option>120 秒</option>
                <option>180 秒</option>
              </select>
            </label>
            <label>
              <span>角色数量</span>
              <select id="castSelect">
                <option>2 人</option>
                <option>3 人</option>
                <option>4 人</option>
                <option>5+ 人</option>
              </select>
            </label>
            <label>
              <span>风格关键词</span>
              <select id="styleSelect">
                <option>冷白光，紧凑节奏，张力递进</option>
                <option>温润明亮，生活质感，小人物情绪</option>
                <option>华丽古装，慢镜语言，氛围感</option>
                <option>霓虹反射，偏电影，动作感</option>
              </select>
            </label>
          </div>

          <button class="primary-button" id="generateBtn" type="button">生成短剧脚本</button>
        </section>

        <section class="board-area" aria-label="脚本场景区">
          <div class="board-toolbar">
            <div>
              <p class="eyebrow">Scene Board</p>
              <h2>脚本场景</h2>
            </div>
            <div class="mini-badge" id="sceneBadge">正在准备</div>
          </div>
          <div class="shot-grid" id="shotGrid"></div>
        </section>

        <aside class="panel inspector-panel" aria-label="脚本输出面板">
          <div class="panel-header">
            <div>
              <p class="eyebrow">Output</p>
              <h2>生成结果</h2>
            </div>
            <span class="shot-pill" id="activeShotId">--</span>
          </div>

          <label class="field-label" for="scriptOutput">完整台本</label>
          <textarea id="scriptOutput" spellcheck="false"></textarea>

          <div class="control-row" role="group" aria-label="输出操作">
            <button class="secondary-button" id="copyScript" type="button">复制台本</button>
            <button class="secondary-button" id="downloadScript" type="button">下载 .txt</button>
          </div>

          <label class="field-label" for="exportOutput">脚本 JSON</label>
          <textarea id="exportOutput" spellcheck="false" readonly></textarea>
          <button class="secondary-button" id="copyJson" type="button">复制 JSON</button>
        </aside>
      </main>
    </div>

    <script src="./app.js"></script>
  </body>
</html>
